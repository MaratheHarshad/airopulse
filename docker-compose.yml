version: "3.8"

services:
  llm-service:
    build:
      context: ./airopulse-llm-service
    container_name: airopulse-llm
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  flight-service:
    build:
      context: ./airopulse-flight-tracker
    container_name: airopulse-flight
    ports:
      - "8080:8080"
    environment:
      - LLM_SERVICE_URL=http://llm-service:8000
    depends_on:
      - llm-service
